<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Preparation Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AI Interview Preparation Platform</h1>
        <p>Practice Today. Succeed Tomorrow!</p>
    </header>

    <main>
        <section class="card">
            <h2>Practice Interview Questions</h2>

            <label for="topic">Choose a Topic:</label>

            <select id="topic">
                <option value="Java">Java</option>
                <option value="Python">Python</option>
                <option value="SQL">SQL</option>
                <option value="HR">HR Interview</option>
            </select>

            <button id="questionButton">Get Question</button>

            <h3>Interview Question</h3>
            <p id="question">Click Get Question to begin.</p>

            <label for="answer">Your Answer:</label>

            <textarea id="answer" placeholder="Type your answer here..."></textarea>

            <button id="feedbackButton">Get Feedback</button>

            <h3>Feedback</h3>
            <p id="feedback">Your feedback will appear here.</p>
        </section>
    </main>

    <footer>
        <p>AI Interview Preparation Platform</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
